<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roles semanales</title>
  <style>
    :root { --green:#0b6e63; --green-soft:#d9ddda; --green-line:#2c7b70; --blue:#3c7f8f; --gold:#a87d10; --red:#a51f27; --bg:#edf1f2; --paper:#f5f5f3; --border:#d8d8d4; --text:#152128; --muted:#5e6a70; --tab:#e9edeb; --night:#183556; --daychip:#e0b11a; --chip:#f0f3f4; }
    * { box-sizing:border-box; }
    html, body { margin:0; padding:0; }
    body { font-family:Arial,Helvetica,sans-serif; background:var(--bg); color:var(--text); padding:14px; }
    .app { max-width:980px; margin:0 auto; }
    .meeting-menu { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; margin:0 0 12px; width:100%; }
    .meeting-tab { border:1px solid #cfd6d8; background:var(--tab); color:#23443f; padding:11px 8px; border-radius:999px; font-size:clamp(11px,2.6vw,14px); font-weight:800; cursor:pointer; text-align:center; width:100%; line-height:1.08; min-height:42px; display:flex; align-items:center; justify-content:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .meeting-tab.active { background:var(--green); color:#fff; border-color:var(--green); box-shadow:0 2px 8px rgba(11,110,99,.18); }
    .meeting-tab .topline, .meeting-tab .bottomline { display:inline; }
    .meeting-tab .bottomline { margin-left:3px; }
    .view { display:none; } .view.active { display:block; } .hidden { display:none!important; }
    .loading-state,.empty-state,.error-state { background:#fff; border:1px dashed #cad2d6; border-radius:20px; padding:28px 20px; text-align:center; color:#506067; font-size:16px; }
    .error-state small { display:block; margin-top:8px; color:#8b4a4a; white-space:pre-wrap; }

    .card { background:var(--paper); border:1px solid var(--border); border-radius:18px; box-shadow:0 2px 10px rgba(0,0,0,.05); overflow:hidden; }
    .head { background:var(--green); color:#fff; padding:14px 18px 10px; }
    .head-nav { display:grid; grid-template-columns:44px 1fr 44px; align-items:center; gap:10px; }
    .nav-arrow { width:44px; height:44px; border:none; border-radius:999px; background:rgba(255,255,255,.16); color:#fff; font-size:20px; font-weight:800; cursor:pointer; }
    .nav-arrow:disabled { opacity:.35; cursor:not-allowed; }
    .head-title { text-align:center; font-size:clamp(1.08rem,2vw,1.55rem); font-weight:800; line-height:1.2; }
    .sub { background:var(--green-soft); color:var(--green); padding:6px 18px 8px; font-weight:700; }
    .block { padding:0 18px 12px; }
    .section-title { font-size:1.1rem; font-weight:800; text-transform:uppercase; margin:14px 0 8px; padding-bottom:6px; border-bottom:3px solid; }
    .s-blue { color:var(--blue); border-color:#4f8d98; } .s-gold { color:var(--gold); border-color:#b18a18; } .s-red { color:var(--red); border-color:#b13338; }
    .song { float:right; font-size:.98rem; font-weight:700; }
    .item { margin:10px 0; }
    .item-title { font-size:1.08rem; font-weight:700; line-height:1.25; }
    .blue-t { color:var(--blue); } .gold-t { color:var(--gold); } .red-t { color:var(--red); }
    .item-person { margin-top:5px; margin-left:14px; font-size:1.05rem; color:#111; }
    .lector-below { margin-top:2px; margin-left:14px; color:var(--red); font-size:1rem; font-weight:700; }
    .lector-below .lector-name { color:#111; font-weight:400; margin-left:4px; }
    .footer-note,.footer-prayer,.cleaning { padding:0 18px 12px; color:var(--green); font-weight:700; }
    .cleaning { font-size:1.35rem; padding-bottom:18px; }

    .assembly-wrap { padding:40px 24px 44px; text-align:center; }
    .assembly-badge { display:inline-block; background:var(--green-soft); color:var(--green); font-size:.85rem; font-weight:800; letter-spacing:.04em; text-transform:uppercase; padding:6px 14px; border-radius:999px; margin-bottom:18px; }
    .assembly-name { font-size:clamp(1.6rem,3.4vw,2.5rem); font-weight:900; color:var(--green); line-height:1.25; }
    .assembly-theme { margin-top:12px; font-size:clamp(1.15rem,2.2vw,1.55rem); font-weight:700; color:#275e58; font-style:italic; }

    .wk-wrap { max-width:780px; margin:0 auto; }
    .wk-card { background:#f7f7f2; border:2px solid #2f8b7f; border-radius:0 0 42px 42px; overflow:hidden; }
    .wk-date { background:var(--green); color:#fff; padding:14px 18px 12px; border-bottom:1px solid var(--green-line); }
    .wk-date-nav { display:grid; grid-template-columns:44px 1fr 44px; gap:10px; align-items:center; }
    .wk-date-title { text-align:center; font-size:clamp(1.72rem,2.5vw,2.2rem); font-weight:800; line-height:1.1; color:#fff; }
    .wk-body { padding:16px 44px 22px; }
    .wk-president { color:var(--green); font-size:clamp(1rem,1.25vw,1.25rem); font-weight:800; margin-bottom:14px; }
    .wk-president .name { font-weight:400; color:#275e58; }
    .wk-band { display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:3px solid; padding-bottom:6px; margin-top:10px; }
    .wk-band-left { display:flex; align-items:center; gap:8px; min-width:0; }
    .wk-green-band { color:var(--green); border-color:var(--green-line); }
    .wk-red-band { color:#b11f29; border-color:#c43a42; }
    .wk-band-title { font-size:clamp(1rem,1.28vw,1.32rem); font-weight:800; text-transform:uppercase; line-height:1.1; }
    .wk-band-song { font-size:clamp(.94rem,1.05vw,1.1rem); font-weight:700; white-space:nowrap; }
    .wk-main-title { text-align:center; color:var(--green); font-size:clamp(2rem,3.6vw,3rem); font-weight:800; line-height:1.12; margin:22px auto 10px; }
    .wk-main-speaker { text-align:center; color:#165a56; font-size:clamp(1.45rem,1.9vw,2rem); margin:10px 0 4px; }
    .wk-main-sub { text-align:center; color:#2d6963; font-size:clamp(1.03rem,1.35vw,1.28rem); margin:0 0 12px; }
    .wk-watch-title { text-align:center; color:#ab1a23; font-size:clamp(1.95rem,3vw,2.8rem); font-weight:800; line-height:1.13; margin:20px auto 10px; }
    .wk-watch-conductor { text-align:center; color:#8c1820; font-size:clamp(1.35rem,1.7vw,1.8rem); margin:8px 0 4px; }
    .wk-watch-lector { text-align:center; color:#8c1820; font-size:clamp(1rem,1.35vw,1.12rem); margin:2px 0 18px; }
    .wk-foot-song { text-align:right; color:var(--green); font-size:clamp(1.2rem,1.4vw,1.5rem); font-weight:800; margin-top:10px; }
    .wk-cleaning { text-align:right; color:var(--green); font-size:clamp(2rem,2.8vw,3rem); font-weight:900; margin-top:10px; }
    .wk-support { margin-top:10px; color:var(--green); font-size:clamp(1rem,1.25vw,1.12rem); font-weight:700; }
    .wk-support div { margin:3px 0; }
    .wk-support span { font-weight:400; color:#163d3a; margin-left:6px; }

    .pred-wrap { display:grid; gap:14px; }
    .pred-next { display:none; }
    .pred-next-label { font-size:15px; font-weight:900; letter-spacing:.05em; text-transform:uppercase; color:var(--green); margin-bottom:10px; }
    .pred-next-head { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:flex-start; }
    .pred-dayline { font-size:clamp(1.25rem,1.9vw,1.7rem); font-weight:800; color:#0f3c37; }
    .pred-hours { margin-top:4px; color:var(--muted); font-size:1rem; }
    .pred-chip { display:inline-block; padding:7px 14px; border-radius:999px; color:#fff; font-size:.9rem; font-weight:800; box-shadow:0 1px 4px rgba(0,0,0,.12); }
    .pred-chip.manana { background:var(--daychip); color:#2b2400; } .pred-chip.noche { background:var(--night); }
    .pred-next-body { margin-top:14px; display:grid; gap:10px; }
    .pred-point-big { font-size:1.22rem; font-weight:900; color:var(--green); line-height:1.15; }
    .pred-conductor { font-size:1rem; font-weight:600; color:#22353a; }
    .pred-territory-line { font-size:.96rem; font-weight:700; color:#22353a; }
    .pred-program { background:#fff; border:1px solid #d8e0de; border-radius:20px; overflow:hidden; box-shadow:0 2px 10px rgba(0,0,0,.04); }
    .pred-program-head { padding:16px; border-bottom:1px solid #e2e8e6; }
    .pred-program-title { font-size:1.2rem; font-weight:800; color:#113d37; }
    .pred-week-label { margin-top:4px; font-size:.95rem; color:var(--muted); font-weight:700; }
    .pred-days { display:grid; gap:12px; padding:12px; }
    .pred-day-card { background:#fff; border:1px solid #d7e1de; border-radius:18px; overflow:hidden; }
    .pred-day-head { background:var(--green); color:#fff; padding:14px 14px 12px; text-align:center; }
    .pred-day-name { font-size:1.3rem; font-weight:900; letter-spacing:.03em; }
    .pred-day-grid { display:grid; grid-template-columns:1fr 1fr; }
    .pred-shift-col { padding:14px; min-height:120px; }
    .pred-shift-col + .pred-shift-col { border-left:1px solid #e6ecea; }
    .pred-shift-group { display:grid; gap:10px; }
    .pred-shift-top { display:flex; justify-content:space-between; gap:8px; margin-bottom:8px; }
    .pred-shift-time { font-size:.95rem; font-weight:800; color:#22353a; }
    .pred-entry + .pred-entry { border-top:1px solid #e6ecea; padding-top:10px; }
    .pred-shift-point { font-size:1.06rem; font-weight:900; color:var(--green); line-height:1.18; }
    .pred-shift-conductor { margin-top:6px; font-size:.95rem; color:#22353a; font-weight:600; }
    .pred-shift-territory { margin-top:8px; font-size:.93rem; color:#22353a; font-weight:700; }
    .pred-shift-note { display:inline-block; margin-top:8px; background:var(--chip); color:#33444a; border-radius:999px; padding:6px 10px; font-size:.88rem; font-weight:700; }
    .pred-empty { color:var(--muted); font-size:.95rem; font-style:italic; padding-top:8px; }

    /* MAPA SVG HÍBRIDO RÁPIDO */
    .map-wrap { background:#fff; border:1px solid var(--border); border-radius:18px; overflow:hidden; box-shadow:0 2px 10px rgba(0,0,0,.06); }
    .map-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 12px; background:#f4f7f6; border-bottom:1px solid #dde5e3; flex-wrap:wrap; }
    .map-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .map-btn { border:1px solid #c9d4d1; background:#fff; color:#1c4a44; padding:8px 12px; border-radius:999px; font-size:14px; font-weight:700; cursor:pointer; }
    .map-btn:hover { background:#f3f7f6; }
    .map-help { color:#516166; font-size:13px; }
    .map-viewport { position:relative; width:100%; height:calc(100vh - 180px); min-height:72vh; background:#edf1f2; overflow:hidden; touch-action:none; }
    .map-inline-host { position:absolute; inset:0; user-select:none; }
    .map-render-layer { position:absolute; inset:0; will-change:transform; transform-origin:0 0; }
    .map-render-layer svg { width:100%; height:100%; display:block; pointer-events:none; }
    .map-hud { position:absolute; right:12px; bottom:12px; background:rgba(255,255,255,.92); border:1px solid #d7dfdc; color:#33444a; border-radius:999px; padding:6px 10px; font-size:12px; font-weight:700; pointer-events:none; }
    .map-status { padding:8px 12px 12px; color:#516166; font-size:13px; }

    /* ===== MODO EDICIÓN (#admin) ===== */
    body.is-admin { padding-bottom:96px; }
    .admin-top { display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--night); color:#fff; padding:10px 14px; border-radius:14px; margin:0 0 10px; font-weight:800; font-size:14px; letter-spacing:.03em; }
    .admin-top button { border:1px solid rgba(255,255,255,.4); background:transparent; color:#fff; padding:6px 12px; border-radius:999px; font-weight:700; cursor:pointer; }
    .ed { font:inherit; color:inherit; background:rgba(255,255,255,.75); border:1px dashed #8fb2ac; border-radius:8px; padding:2px 6px; margin:1px 0; width:min(100%,14em); min-width:0; vertical-align:baseline; }
    .ed::placeholder { color:#9aa8a6; font-weight:400; }
    .ed:hover { background:#fff; border-color:var(--green); }
    .ed:focus { outline:2px solid var(--green); outline-offset:1px; background:#fff; border-style:solid; }
    .ed.changed { background:#fff4c2; border:1px solid #d9a400; }
    .ed-block { display:block; width:100%; text-align:center; }
    .ed-multi { resize:none; overflow:hidden; line-height:1.12; font-weight:800; display:block; }
    .ed-song { width:3.4em; text-align:center; font-weight:800; }
    .ed-cleaning { width:5.5em; text-align:center; }
    .ed-pair { display:inline-flex; flex-wrap:wrap; align-items:center; gap:4px 6px; max-width:100%; }
    .ed-pair .ed { flex:1 1 9em; width:auto; }
    .item-person.ed-pair { display:flex; }
    .ed-sep { font-weight:700; color:#6b7a78; }
    .wk-support .ed-pair { margin-left:6px; font-weight:400; color:#163d3a; }
    .admin-bar { position:fixed; left:0; right:0; bottom:0; z-index:50; background:var(--night); color:#fff; box-shadow:0 -4px 16px rgba(0,0,0,.18); }
    .admin-bar-inner { max-width:980px; margin:0 auto; display:flex; align-items:center; gap:10px; padding:12px 14px calc(12px + env(safe-area-inset-bottom)); }
    .admin-count { flex:1; font-weight:700; font-size:14px; }
    .admin-count small { display:block; font-weight:400; opacity:.75; font-size:12px; margin-top:2px; }
    .btn-discard { border:1px solid rgba(255,255,255,.4); background:transparent; color:#fff; padding:11px 14px; border-radius:999px; font-weight:700; cursor:pointer; }
    .btn-publish { border:none; background:var(--daychip); color:#2b2400; padding:12px 22px; border-radius:999px; font-weight:900; font-size:15px; letter-spacing:.04em; cursor:pointer; }
    .btn-publish:disabled, .btn-discard:disabled { opacity:.4; cursor:not-allowed; }
    .admin-login { position:fixed; inset:0; z-index:60; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:16px; }
    .login-card { background:#fff; border:1px solid var(--border); border-radius:20px; padding:26px 22px; width:100%; max-width:360px; box-shadow:0 6px 24px rgba(0,0,0,.08); display:grid; gap:12px; }
    .login-title { font-size:1.25rem; font-weight:900; color:var(--green); text-align:center; }
    .login-sub { font-size:.9rem; color:var(--muted); text-align:center; margin-top:-6px; }
    .login-card input { font:inherit; font-size:16px; padding:12px 14px; border:1px solid #c9d4d1; border-radius:12px; }
    .login-card button { border:none; background:var(--green); color:#fff; font-weight:800; font-size:16px; padding:12px; border-radius:12px; cursor:pointer; }
    .login-card button:disabled { opacity:.6; }
    .login-error { color:var(--red); font-size:.9rem; text-align:center; min-height:1.1em; }
    .toast { position:fixed; left:50%; bottom:96px; transform:translateX(-50%); z-index:70; background:#0b6e63; color:#fff; padding:10px 18px; border-radius:999px; font-weight:800; box-shadow:0 4px 14px rgba(0,0,0,.2); max-width:calc(100% - 32px); text-align:center; }
    .toast.error { background:var(--red); }

    @media (max-width:760px) {
      .pred-day-grid { grid-template-columns:1fr; }
      .pred-shift-col + .pred-shift-col { border-left:none; border-top:1px solid #e6ecea; }
      .wk-body { padding:14px 18px 20px; }
      .wk-main-title { font-size:clamp(1.8rem,6.2vw,2.55rem); }
      .wk-watch-title { font-size:clamp(1.8rem,5.7vw,2.45rem); }
      .map-viewport { height:calc(100vh - 210px); min-height:68vh; }
    }
    @media (max-width:640px) {
      body { padding:0; }
      .meeting-menu { position:sticky; top:0; z-index:20; background:rgba(237,241,242,.97); padding:10px 8px 8px; margin-bottom:0; backdrop-filter:blur(6px); }
      .card,.pred-program,.pred-next,.wk-card,.map-wrap { border-left:none; border-right:none; box-shadow:none; border-radius:0; }
      .pred-program-head,.pred-days { padding-left:16px; padding-right:16px; }
      .head-nav, .wk-date-nav { grid-template-columns:38px 1fr 38px; gap:6px; }
      .nav-arrow { width:38px; height:38px; font-size:18px; }
      .head-title { font-size:1rem; }
      .wk-date-title { font-size:1.65rem; }
    }
    @media (max-width:470px) {
      .meeting-menu { gap:4px; }
      .meeting-tab { min-height:42px; font-size:11px; padding:7px 3px; overflow:visible; text-overflow:clip; }
      .meeting-tab.wrap-two { white-space:normal; flex-direction:column; align-items:center; justify-content:center; gap:1px; }
      .meeting-tab.wrap-two .topline, .meeting-tab.wrap-two .bottomline { display:block; width:100%; margin:0; text-align:center; line-height:1; }
      .meeting-tab.wrap-two .bottomline { font-size:.9em; }
      .map-btn { padding:7px 10px; font-size:13px; }
      .map-help { font-size:12px; }
    }
    @media (max-width:420px) {
      .meeting-tab { font-size:10px; padding:7px 2px; }
      .meeting-tab.wrap-two .bottomline { font-size:.88em; }
      .pred-day-name { font-size:1.15rem; }
      .pred-dayline { font-size:1.18rem; }
    }
  </style>
</head>
<body>
  <div class="admin-login hidden" id="admin-login">
    <form class="login-card" id="login-form" autocomplete="off">
      <div class="login-title">Modo edición</div>
      <div class="login-sub">Ingresa la contraseña para editar los roles</div>
      <input type="password" id="login-pw" placeholder="Contraseña" autocomplete="current-password" />
      <button type="submit" id="login-btn">Ingresar</button>
      <div class="login-error" id="login-error"></div>
    </form>
  </div>
  <div class="admin-bar hidden" id="admin-bar">
    <div class="admin-bar-inner">
      <div class="admin-count" id="admin-count">Sin cambios</div>
      <button class="btn-discard" id="btn-discard" type="button" disabled>Descartar</button>
      <button class="btn-publish" id="btn-publish" type="button" disabled>PUBLICAR</button>
    </div>
  </div>
  <div class="app">
    <div class="admin-top hidden" id="admin-top"><span>✎ MODO EDICIÓN</span><button type="button" id="admin-exit">Salir</button></div>
    <div class="meeting-menu" role="tablist" aria-label="Tipo de reunión">
      <button class="meeting-tab wrap-two active" data-view="entresemana" type="button"><span class="topline">VIDA Y</span><span class="bottomline">MINISTERIO</span></button>
      <button class="meeting-tab wrap-two" data-view="findesemana" type="button"><span class="topline">CONFERENCIA</span><span class="bottomline">Y ATALAYA</span></button>
    </div>
    <div class="loading-state" id="loading">Cargando roles…</div>
    <div class="view active hidden" id="view-entresemana"></div>
    <div class="view hidden" id="view-findesemana"></div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxCzMZ59Y4rEC8mR0_eqA3_yxDT1OXRC33CqsIUFgBqu92oDBkV-5V7rzD614NSa7cIhw/exec';

    const tabs = Array.from(document.querySelectorAll('.meeting-tab'));
    const views = { entresemana: document.getElementById('view-entresemana'), findesemana: document.getElementById('view-findesemana') };
    let midweekWeeks = [], midweekIndex = 0, weekendWeeks = [], weekendIndex = 0;
    let currentTab = 'entresemana';
    const ADMIN = (location.hash || '').toLowerCase() === '#admin';
    let edits = {};                 // cambios pendientes: "fila|campo" -> { row, field, value, weekKey, meeting }
    let preferKeys = null;          // semana a mantener abierta tras publicar
    let adminPassword = '';

    function activate(viewName, scroll = true) {
      const valid = views[viewName] ? viewName : 'entresemana';
      currentTab = valid;
      tabs.forEach(tab => tab.classList.toggle('active', tab.dataset.view === valid));
      Object.keys(views).forEach(key => views[key].classList.toggle('active', key === valid));
      if (!ADMIN && location.hash !== '#' + valid) history.replaceState(null, '', '#' + valid);
      if (scroll) window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    tabs.forEach(tab => tab.addEventListener('click', () => activate(tab.dataset.view)));
    function esc(v) { return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;'); }
    function normText(v) { return String(v ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase(); }
    function showLoading(isLoading) { document.getElementById('loading').classList.toggle('hidden', !isLoading); Object.values(views).forEach(el => el.classList.toggle('hidden', isLoading)); }
    function showApiError(message, detail='') { showLoading(false); views.entresemana.innerHTML = `<div class="error-state"><strong>${esc(message)}</strong>${detail ? `<small>${esc(detail)}</small>` : ''}</div>`; views.findesemana.innerHTML = `<div class="error-state"><strong>${esc(message)}</strong>${detail ? `<small>${esc(detail)}</small>` : ''}</div>`; activate('entresemana'); }

    /* ===== Detección de la semana actual ===== */
    const DAY_MS = 86400000;
    const MONTHS_ES = { enero:0, febrero:1, marzo:2, abril:3, mayo:4, junio:5, julio:6, agosto:7, septiembre:8, setiembre:8, octubre:9, noviembre:10, diciembre:11 };

    // Perú (UTC-5, sin horario de verano). El ciclo cambia de semana el domingo a las 12:00 p. m.
    const PERU_UTC_OFFSET_MIN = -300;
    const ROLLOVER_WEEKDAY = 0; // 0 = domingo
    const ROLLOVER_HOUR = 12;

    // Hora de pared en Perú, sin importar el reloj/zona del dispositivo
    function peruWallClock(now = new Date()) {
      const shifted = new Date(now.getTime() + PERU_UTC_OFFSET_MIN * 60000);
      return { year: shifted.getUTCFullYear(), month: shifted.getUTCMonth(), day: shifted.getUTCDate(), hour: shifted.getUTCHours(), weekday: shifted.getUTCDay() };
    }

    // Día de referencia: el domingo desde las 12:00 p. m. ya cuenta como la semana siguiente
    function referenceDay(now = new Date()) {
      const p = peruWallClock(now);
      const ref = new Date(p.year, p.month, p.day);
      if (p.weekday === ROLLOVER_WEEKDAY && p.hour >= ROLLOVER_HOUR) ref.setDate(ref.getDate() + 1);
      return ref;
    }

    // Extrae una fecha desde weekKey: 2026-09-07, 2026/9/7, 07-09-2026, 7/9/2026, "Mon Nov 16 2026 ..."
    const MONTHS_EN = { jan:0, feb:1, mar:2, apr:3, may:4, jun:5, jul:6, aug:7, sep:8, oct:9, nov:10, dec:11 };
    function parseDateFromKey(key) {
      const s = String(key ?? '').trim();
      let m = s.match(/(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
      if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
      m = s.match(/(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/);
      if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
      m = s.match(/\b([A-Za-z]{3})[a-z]* (\d{1,2}),? (\d{4})\b/);
      if (m && MONTHS_EN[m[1].toLowerCase()] !== undefined) return new Date(+m[3], MONTHS_EN[m[1].toLowerCase()], +m[2]);
      return null;
    }

    // Extrae la fecha de inicio desde el título: "7-13 de septiembre", "30 de marzo a 5 de abril de 2026"
    function parseWeekStartFromTitle(title, fallbackYear) {
      const raw = normText(title);
      if (!raw) return null;
      const yearMatch = raw.match(/(20\d{2})/);
      const year = yearMatch ? +yearMatch[1] : fallbackYear;
      const cleaned = raw.replace(/\b20\d{2}\b/g, ' ');
      const dayMatch = cleaned.match(/\d{1,2}/);
      if (!dayMatch) return null;
      let monthIndex = -1, bestPos = Infinity;
      for (const name in MONTHS_ES) {
        const pos = cleaned.indexOf(name);
        if (pos >= 0 && pos < bestPos) { bestPos = pos; monthIndex = MONTHS_ES[name]; }
      }
      if (monthIndex < 0) return null;
      return new Date(year, monthIndex, +dayMatch[0]);
    }

    // Fecha de inicio de cada semana, corrigiendo saltos de año cuando el título no lo trae
    function computeWeekStarts(weeks) {
      const fallbackYear = referenceDay().getFullYear();
      const starts = weeks.map(w => parseDateFromKey(w && w.weekKey) || parseWeekStartFromTitle((w && (w.weekTitle || w.headerTitle)) || '', fallbackYear));
      let previous = null;
      for (const date of starts) {
        if (!date) continue;
        if (previous && date - previous < -150 * DAY_MS) date.setFullYear(date.getFullYear() + 1);
        previous = date;
      }
      return starts;
    }

    // Domingo con el que termina cada semana. Si la fecha detectada ya es domingo (p. ej. el título
    // del fin de semana "15 de noviembre"), ese es el domingo; si es lunes (inicio de semana), se avanza al domingo.
    function weekSunday(date) {
      if (!date) return null;
      return new Date(date.getFullYear(), date.getMonth(), date.getDate() + ((7 - date.getDay()) % 7));
    }

    // Se muestra la primera semana cuyo domingo todavía no pasó.
    // El domingo desde las 12:00 p. m. (hora Perú) ya cuenta como lunes => se muestra la semana siguiente.
    // Respaldo: weekKey del API > última semana con fecha.
    function resolveWeekIndex(weeks, currentWeekKey) {
      if (!Array.isArray(weeks) || !weeks.length) return 0;
      const ref = referenceDay();
      const sundays = computeWeekStarts(weeks).map(weekSunday);

      let best = -1;
      for (let i = 0; i < sundays.length; i++) {
        if (sundays[i] && sundays[i] >= ref && (best < 0 || sundays[i] < sundays[best])) best = i;
      }
      if (best >= 0) return best;

      if (currentWeekKey != null && String(currentWeekKey).trim() !== '') {
        let i = weeks.findIndex(w => String(w && w.weekKey) === String(currentWeekKey));
        if (i >= 0) return i;
        const key = normText(currentWeekKey);
        i = weeks.findIndex(w => normText(w && w.weekKey) === key);
        if (i >= 0) return i;
      }

      for (let i = sundays.length - 1; i >= 0; i--) { if (sundays[i]) return i; }
      return 0;
    }
    /* ===== fin detección ===== */

    function loadData(afterSave = false) {
      if (!API_URL) { showApiError('Falta configurar la URL del API.'); return; }
      const keepScroll = window.scrollY;
      showLoading(true);
      const callbackName = '__rolesPrefix_' + Date.now();
      const separator = API_URL.includes('?') ? '&' : '?';
      const src = `${API_URL}${separator}prefix=${callbackName}&_ts=${Date.now()}`;
      const script = document.createElement('script'); script.src = src; script.async = true;
      const timeout = setTimeout(() => { cleanup(); showApiError('No se pudo cargar el API.','Se agotó el tiempo de espera.'); }, 15000);
      function cleanup() { clearTimeout(timeout); delete window[callbackName]; if (script.parentNode) script.parentNode.removeChild(script); }
      window[callbackName] = function(data) {
        cleanup();
        if (!data || data.ok !== true) { showApiError('El API respondió con datos inválidos.', JSON.stringify(data || {})); return; }
        renderAll(data); showLoading(false);
        if (ADMIN) {
          activate(currentTab, !afterSave);
          if (afterSave) window.scrollTo(0, keepScroll);
        } else {
          const requested = (location.hash || '').replace('#','').trim().toLowerCase();
          activate(requested || 'entresemana');
        }
      };
      script.onerror = function() { cleanup(); showApiError('Error al cargar el API.','La URL respondió con error.'); };
      document.body.appendChild(script);
    }

    function renderAll(data) {
      initMidweek(data.entresemana || { hasData:false, weeks:[] });
      initWeekend(data.findesemana || { hasData:false, weeks:[] });
    }

    /* ===== Helpers de edición ===== */
    function cellVal(week, row, field) { const c = week && week.cells && week.cells[row]; return c ? String(c[field] ?? '') : ''; }
    // Casilla editable ligada a una celda de la hoja (fila + campo: d=discursante, a=ayudante, n=cántico)
    function ed(week, meeting, row, field, opts = {}) {
      if (!row) return '';
      const key = row + '|' + field;
      const orig = cellVal(week, row, field);
      const pending = edits[key];
      const cur = pending ? pending.value : orig;
      if (opts.multiline) {
        return `<textarea class="ed ed-multi ${opts.cls || ''} ${pending ? 'changed' : ''}" rows="1" data-key="${key}" data-row="${row}" data-field="${field}" data-orig="${esc(orig)}" data-week="${esc(week.weekKey)}" data-meeting="${meeting}" placeholder="${esc(opts.ph || '—')}" autocomplete="off" spellcheck="false">${esc(cur)}</textarea>`;
      }
      return `<input class="ed ${opts.cls || ''} ${pending ? 'changed' : ''}" type="text" data-key="${key}" data-row="${row}" data-field="${field}" data-orig="${esc(orig)}" data-week="${esc(week.weekKey)}" data-meeting="${meeting}" value="${esc(cur)}" placeholder="${esc(opts.ph || '—')}" ${field === 'n' ? 'inputmode="numeric"' : ''} autocomplete="off" spellcheck="false">`;
    }
    // El textarea del título crece según el texto (el título del discurso suele ocupar 2-3 líneas)
    function autosize(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
    function edPair(week, meeting, row, ph1 = 'Nombre', ph2 = 'Nombre', cls = '') {
      if (!row) return '';
      return `<span class="ed-pair ${cls}">${ed(week, meeting, row, 'd', { ph: ph1 })}<span class="ed-sep">/</span>${ed(week, meeting, row, 'a', { ph: ph2 })}</span>`;
    }

    function renderItemList(items, cls, lector = '', week = null, opts = {}) {
      return (items || []).map(it => {
        let names = '';
        if (ADMIN && week && it.row) {
          const showHelper = opts.helper || cellVal(week, it.row, 'a');
          names = `<div class="item-person ed-pair">${ed(week, 'entresemana', it.row, 'd', { ph: 'Discursante' })}${showHelper ? `<span class="ed-sep">/</span>${ed(week, 'entresemana', it.row, 'a', { ph: 'Ayudante' })}` : ''}</div>`;
        } else if (it.names) {
          names = `<div class="item-person">${esc(it.names)}</div>`;
        }
        let lec = '';
        if (it.isCongBibleStudy) {
          if (ADMIN && week && week.refs && week.refs.lector) lec = `<div class="lector-below">Lector:<span class="lector-name"> ${ed(week, 'entresemana', week.refs.lector, 'd', { ph: 'Lector' })}</span></div>`;
          else if (lector) lec = `<div class="lector-below">Lector:<span class="lector-name"> ${esc(lector)}</span></div>`;
        }
        return `<div class="item"><div class="item-title ${cls}">${it.number ? esc(it.number)+'. ' : ''}${esc(it.title || '')}</div>${names}${lec}</div>`;
      }).join('');
    }
    function renderAssemblyBlock(name, theme) {
      return `<div class="assembly-wrap"><div class="assembly-badge">NO HAY REUNIÓN — ASAMBLEA</div>${name ? `<div class="assembly-name">${esc(name)}</div>` : ''}${theme ? `<div class="assembly-theme">“${esc(theme)}”</div>` : ''}</div>`;
    }
    function indexForKey(weeks, key) { return key ? weeks.findIndex(w => String(w.weekKey) === String(key)) : -1; }

    /* ===== Vida y Ministerio ===== */
    function initMidweek(data) {
      if (!data || !data.hasData || !Array.isArray(data.weeks) || !data.weeks.length) { views.entresemana.innerHTML = '<div class="empty-state">No hay datos cargados para <strong>Vida y Ministerio</strong>.</div>'; return; }
      midweekWeeks = data.weeks.slice();
      const kept = indexForKey(midweekWeeks, preferKeys && preferKeys.entresemana);
      midweekIndex = kept >= 0 ? kept : resolveWeekIndex(midweekWeeks, data.currentWeekKey);
      paintCurrentMidweekWeek();
    }
    function paintCurrentMidweekWeek() {
      const d = midweekWeeks[midweekIndex]; if (!d) return;
      const R = d.refs || {};
      const M = 'entresemana';
      const navHtml = `<div class="head"><div class="head-nav"><button class="nav-arrow" id="mw-prev" ${midweekIndex === 0 ? 'disabled' : ''}>◀</button><div class="head-title">${esc(d.weekTitle || '')}</div><button class="nav-arrow" id="mw-next" ${midweekIndex === midweekWeeks.length - 1 ? 'disabled' : ''}>▶</button></div></div>`;
      const looksLikeAssembly = normText(d.president || '').includes('asamblea');
      if (d.isAssembly || looksLikeAssembly) {
        const name = d.assemblyName || d.president || '';
        const theme = d.assemblyTheme || '';
        views.entresemana.innerHTML = `<div class="card">${navHtml}${renderAssemblyBlock(name, theme)}</div>`;
      } else {
        const A = ADMIN;
        const presidentHtml = A ? (R.president ? `<div class="sub">Presidente: ${ed(d, M, R.president, 'd', { ph: 'Presidente' })}</div>` : '') : (d.president ? `<div class="sub">Presidente: ${esc(d.president)}</div>` : '');
        const prayerHtml = A ? (R.prayer ? `<div class="footer-prayer">Oración conclusión&nbsp;&nbsp;${ed(d, M, R.prayer, 'd', { ph: 'Hermano' })}</div>` : '') : (d.prayerName ? `<div class="footer-prayer">Oración conclusión&nbsp;&nbsp;${esc(d.prayerName)}</div>` : '');
        const cleaningHtml = A ? (R.cleaning ? `<div class="cleaning">${esc(d.cleaningTask || 'Limpieza')} ${ed(d, M, R.cleaning, 'd', { cls: 'ed-cleaning', ph: 'Grupo' })}</div>` : '') : (d.cleaningLabel ? `<div class="cleaning">${esc(d.cleaningLabel)}</div>` : '');
        views.entresemana.innerHTML = `<div class="card">${navHtml}${presidentHtml}<div class="block"><div class="section-title s-blue">TESOROS DE LA BIBLIA ${d.openingSong ? `<span class="song">Canción ${esc(d.openingSong)}</span>` : ''}</div>${renderItemList(d.treasures, 'blue-t', '', d)}<div class="section-title s-gold">SEAMOS MEJORES MAESTROS</div>${renderItemList(d.teachers, 'gold-t', '', d, { helper: true })}<div class="section-title s-red">NUESTRA VIDA CRISTIANA ${d.middleSong ? `<span class="song">Canción ${esc(d.middleSong)}</span>` : ''}</div>${renderItemList(d.life, 'red-t', d.lector || '', d)}</div>${d.closingSong ? `<div class="footer-note">Palabras de conclusión y canción ${esc(d.closingSong)}</div>` : ''}${prayerHtml}${cleaningHtml}</div>`;
      }
      const prev = document.getElementById('mw-prev'), next = document.getElementById('mw-next');
      if (prev) prev.onclick = () => { if (midweekIndex > 0 && confirmLeaveWeek(M, d.weekKey)) { midweekIndex--; paintCurrentMidweekWeek(); } };
      if (next) next.onclick = () => { if (midweekIndex < midweekWeeks.length - 1 && confirmLeaveWeek(M, d.weekKey)) { midweekIndex++; paintCurrentMidweekWeek(); } };
    }

    /* ===== Conferencia y Atalaya ===== */
    function initWeekend(data) {
      if (!data || !data.hasData || !Array.isArray(data.weeks) || !data.weeks.length) { views.findesemana.innerHTML = '<div class="empty-state">No hay datos cargados para <strong>Conferencia y Atalaya</strong>.</div>'; return; }
      weekendWeeks = data.weeks.slice();
      const kept = indexForKey(weekendWeeks, preferKeys && preferKeys.findesemana);
      weekendIndex = kept >= 0 ? kept : resolveWeekIndex(weekendWeeks, data.currentWeekKey);
      paintCurrentWeekendWeek();
    }
    function supportLine(label, value) { return value ? `<div>${label}:<span>${esc(value)}</span></div>` : ''; }
    function supportLineAdmin(d, label, row) { return row ? `<div>${label}:${edPair(d, 'findesemana', row)}</div>` : ''; }
    function paintCurrentWeekendWeek() {
      const d = weekendWeeks[weekendIndex]; if (!d) return;
      const navHtml = `<div class="wk-date"><div class="wk-date-nav"><button class="nav-arrow" id="wk-prev" ${weekendIndex === 0 ? 'disabled' : ''}>◀</button><div class="wk-date-title">${esc(d.headerTitle || '')}</div><button class="nav-arrow" id="wk-next" ${weekendIndex === weekendWeeks.length - 1 ? 'disabled' : ''}>▶</button></div></div>`;
      const looksLikeAssembly = normText(d.president || '').includes('asamblea');
      if (d.isAssembly || looksLikeAssembly) {
        const name = d.assemblyName || d.president || '';
        const theme = d.assemblyTheme || '';
        views.findesemana.innerHTML = `<div class="wk-wrap"><div class="wk-card">${navHtml}<div class="wk-body">${renderAssemblyBlock(name, theme)}</div></div></div>`;
      } else if (ADMIN) {
        views.findesemana.innerHTML = `<div class="wk-wrap"><div class="wk-card">${navHtml}<div class="wk-body">${renderWeekendAdminBody(d)}</div></div></div>`;
        requestAnimationFrame(() => views.findesemana.querySelectorAll('textarea.ed').forEach(autosize));
      } else {
        views.findesemana.innerHTML = `<div class="wk-wrap"><div class="wk-card">${navHtml}<div class="wk-body">${d.president ? `<div class="wk-president">PRESIDENTE: <span class="name">${esc(d.president)}</span></div>` : ''}${d.publicTalk ? `<div class="wk-band wk-green-band"><div class="wk-band-left"><div class="wk-band-title">DISCURSO PÚBLICO</div></div>${d.publicTalk.song ? `<div class="wk-band-song">Canción ${esc(d.publicTalk.song)}</div>` : ''}</div><div class="wk-main-title">“${esc(d.publicTalk.title || '')}”</div>${d.publicTalk.speaker ? `<div class="wk-main-speaker">${esc(d.publicTalk.speaker)}</div>` : ''}${d.publicTalk.subtitle ? `<div class="wk-main-sub">${esc(d.publicTalk.subtitle)}</div>` : ''}` : ''}${d.watchtower ? `<div class="wk-band wk-red-band"><div class="wk-band-left"><div class="wk-band-title">REUNIÓN LA ATALAYA</div></div>${d.watchtower.song ? `<div class="wk-band-song">Canción ${esc(d.watchtower.song)}</div>` : ''}</div><div class="wk-watch-title">“${esc(d.watchtower.title || '')}”</div>${d.watchtower.conductor ? `<div class="wk-watch-conductor">${esc(d.watchtower.conductor)}</div>` : ''}${d.watchtower.lector ? `<div class="wk-watch-lector">Lector: ${esc(d.watchtower.lector)}</div>` : ''}` : ''}${d.closingSong ? `<div class="wk-foot-song">Canción ${esc(d.closingSong)}</div>` : ''}${d.cleaningLabel ? `<div class="wk-cleaning">${esc(d.cleaningLabel)}</div>` : ''}<div class="wk-support">${supportLine('Acomodadores', d.support && d.support.acomodadores)}${supportLine('Micrófonos', d.support && d.support.microfonos)}${supportLine('Hospitalidad', d.support && d.support.hospitalidad)}</div></div></div></div>`;
      }
      const prev = document.getElementById('wk-prev'), next = document.getElementById('wk-next');
      if (prev) prev.onclick = () => { if (weekendIndex > 0 && confirmLeaveWeek('findesemana', d.weekKey)) { weekendIndex--; paintCurrentWeekendWeek(); } };
      if (next) next.onclick = () => { if (weekendIndex < weekendWeeks.length - 1 && confirmLeaveWeek('findesemana', d.weekKey)) { weekendIndex++; paintCurrentWeekendWeek(); } };
    }
    function renderWeekendAdminBody(d) {
      const R = d.refs || {}, M = 'findesemana';
      const song = row => row ? `<div class="wk-band-song">Canción ${ed(d, M, row, 'n', { cls: 'ed-song', ph: '#' })}</div>` : '';
      let h = '';
      if (R.president) h += `<div class="wk-president">PRESIDENTE: <span class="name">${ed(d, M, R.president, 'd', { ph: 'Presidente' })}</span></div>`;
      if (d.publicTalk) {
        h += `<div class="wk-band wk-green-band"><div class="wk-band-left"><div class="wk-band-title">DISCURSO PÚBLICO</div></div>${song(R.openingSong)}</div>`;
        h += R.publicTalk
          ? `<div class="wk-main-title">${ed(d, M, R.publicTalk, 't', { cls: 'ed-block', ph: 'Título del discurso', multiline: true })}</div>`
          : `<div class="wk-main-title">“${esc(d.publicTalk.title || '')}”</div>`;
        if (R.publicTalk) {
          h += `<div class="wk-main-speaker">${ed(d, M, R.publicTalk, 'd', { cls: 'ed-block', ph: 'Discursante' })}</div>`;
          h += `<div class="wk-main-sub">${ed(d, M, R.publicTalk, 'a', { cls: 'ed-block', ph: 'Congregación' })}</div>`;
        }
      }
      if (d.watchtower) {
        h += `<div class="wk-band wk-red-band"><div class="wk-band-left"><div class="wk-band-title">REUNIÓN LA ATALAYA</div></div>${song(R.middleSong)}</div>`;
        h += `<div class="wk-watch-title">“${esc(d.watchtower.title || '')}”</div>`;
        if (R.watchtower) h += `<div class="wk-watch-conductor">${ed(d, M, R.watchtower, 'd', { cls: 'ed-block', ph: 'Conductor' })}</div>`;
        if (R.lector) h += `<div class="wk-watch-lector">Lector: ${edPair(d, M, R.lector, 'Lector', 'Lector 2')}</div>`;
      }
      if (R.closingSong) h += `<div class="wk-foot-song">Canción ${ed(d, M, R.closingSong, 'n', { cls: 'ed-song', ph: '#' })}</div>`;
      if (R.cleaning) h += `<div class="wk-cleaning">${esc(d.cleaningTask || 'Limpieza')} ${ed(d, M, R.cleaning, 'd', { cls: 'ed-cleaning', ph: 'Grupo' })}</div>`;
      h += `<div class="wk-support">${supportLineAdmin(d, 'Acomodadores', R.acomodadores)}${supportLineAdmin(d, 'Micrófonos', R.microfonos)}${supportLineAdmin(d, 'Hospitalidad', R.hospitalidad)}</div>`;
      return h;
    }

    /* ===== Modo edición ===== */
    function pendingFor(meeting, weekKey) { return Object.keys(edits).filter(k => edits[k].meeting === meeting && String(edits[k].weekKey) === String(weekKey)); }
    function confirmLeaveWeek(meeting, weekKey) {
      if (!ADMIN) return true;
      const keys = pendingFor(meeting, weekKey);
      if (!keys.length) return true;
      const ok = confirm(`Tienes ${keys.length} cambio(s) sin publicar en esta semana.\n\nSi cambias de semana se descartarán. ¿Continuar sin publicar?`);
      if (ok) { keys.forEach(k => delete edits[k]); updateAdminBar(); }
      return ok;
    }
    function updateAdminBar() {
      if (!ADMIN) return;
      const n = Object.keys(edits).length;
      const meetings = new Set(Object.values(edits).map(e => e.meeting));
      const where = [meetings.has('entresemana') ? 'Vida y Ministerio' : '', meetings.has('findesemana') ? 'Conferencia y Atalaya' : ''].filter(Boolean).join(' y ');
      document.getElementById('admin-count').innerHTML = n ? `${n} cambio${n === 1 ? '' : 's'} sin publicar<small>${esc(where)}</small>` : 'Sin cambios<small>Toca un nombre para editarlo</small>';
      document.getElementById('btn-publish').disabled = !n;
      document.getElementById('btn-discard').disabled = !n;
    }
    function toast(msg, isError = false) {
      const t = document.createElement('div');
      t.className = 'toast' + (isError ? ' error' : '');
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), isError ? 6000 : 3000);
    }
    async function apiPost(body) {
      const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
      return res.json();
    }
    function storePw(pw) { try { pw ? sessionStorage.setItem('fvAdminPw', pw) : sessionStorage.removeItem('fvAdminPw'); } catch (e) {} }
    function readPw() { try { return sessionStorage.getItem('fvAdminPw') || ''; } catch (e) { return ''; } }

    function showLogin(message = '') {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('admin-login').classList.remove('hidden');
      document.getElementById('login-error').textContent = message;
      setTimeout(() => document.getElementById('login-pw').focus(), 50);
    }
    function enterAdmin() {
      document.getElementById('admin-login').classList.add('hidden');
      document.getElementById('admin-top').classList.remove('hidden');
      document.getElementById('admin-bar').classList.remove('hidden');
      document.body.classList.add('is-admin');
      updateAdminBar();
      loadData();
    }
    async function startAdmin() {
      document.title = 'Editar roles';
      const saved = readPw();
      if (!saved) { showLogin(); return; }
      try {
        const r = await apiPost({ action: 'login', password: saved });
        if (r && r.ok) { adminPassword = saved; enterAdmin(); } else { storePw(''); showLogin(); }
      } catch (e) { showLogin('No se pudo conectar con el servidor.'); }
    }

    if (ADMIN) {
      document.getElementById('login-form').addEventListener('submit', async ev => {
        ev.preventDefault();
        const pw = document.getElementById('login-pw').value.trim();
        if (!pw) return;
        const btn = document.getElementById('login-btn');
        btn.disabled = true; btn.textContent = 'Verificando…';
        document.getElementById('login-error').textContent = '';
        try {
          const r = await apiPost({ action: 'login', password: pw });
          if (r && r.ok) { adminPassword = pw; storePw(pw); enterAdmin(); }
          else document.getElementById('login-error').textContent = 'Contraseña incorrecta.';
        } catch (e) {
          document.getElementById('login-error').textContent = 'No se pudo conectar. Verifica que el Apps Script esté actualizado.';
        }
        btn.disabled = false; btn.textContent = 'Ingresar';
      });

      // Registrar cambios mientras se escribe
      document.addEventListener('input', ev => {
        const el = ev.target;
        if (!el.classList || !el.classList.contains('ed')) return;
        const key = el.dataset.key;
        const value = el.value.trim();
        if (value === String(el.dataset.orig || '').trim()) delete edits[key];
        else edits[key] = { row: +el.dataset.row, field: el.dataset.field, value, weekKey: el.dataset.week, meeting: el.dataset.meeting };
        el.classList.toggle('changed', !!edits[key]);
        if (el.tagName === 'TEXTAREA') autosize(el);
        updateAdminBar();
      });
      // Enter pasa a la siguiente casilla
      document.addEventListener('keydown', ev => {
        const el = ev.target;
        if (ev.key !== 'Enter' || !el.classList || !el.classList.contains('ed')) return;
        ev.preventDefault();
        const all = Array.from(views[currentTab].querySelectorAll('.ed'));
        const next = all[all.indexOf(el) + 1];
        if (next) { next.focus(); next.select(); } else el.blur();
      });
      document.addEventListener('focusin', ev => { if (ev.target.classList && ev.target.classList.contains('ed')) ev.target.select(); });

      document.getElementById('btn-discard').addEventListener('click', () => {
        if (!Object.keys(edits).length || !confirm('¿Descartar todos los cambios sin publicar?')) return;
        edits = {}; paintCurrentMidweekWeek(); paintCurrentWeekendWeek(); updateAdminBar();
      });

      document.getElementById('btn-publish').addEventListener('click', async () => {
        const changes = Object.values(edits);
        if (!changes.length) return;
        const btn = document.getElementById('btn-publish');
        btn.disabled = true; btn.textContent = 'Publicando…';
        document.getElementById('btn-discard').disabled = true;
        try {
          const r = await apiPost({ action: 'save', password: adminPassword, changes });
          if (r && r.ok) {
            edits = {};
            preferKeys = {
              entresemana: midweekWeeks[midweekIndex] && midweekWeeks[midweekIndex].weekKey,
              findesemana: weekendWeeks[weekendIndex] && weekendWeeks[weekendIndex].weekKey
            };
            toast(`✓ Publicado (${r.updated} cambio${r.updated === 1 ? '' : 's'})`);
            loadData(true);
          } else if (r && r.auth === false) {
            storePw(''); adminPassword = '';
            toast('La contraseña ya no es válida. Ingresa de nuevo.', true);
            showLogin();
          } else {
            toast((r && r.error) || 'No se pudo publicar.', true);
          }
        } catch (e) {
          toast('Error de conexión. Tus cambios siguen aquí; intenta de nuevo.', true);
        }
        btn.textContent = 'PUBLICAR';
        updateAdminBar();
      });

      document.getElementById('admin-exit').addEventListener('click', () => {
        if (Object.keys(edits).length && !confirm('Tienes cambios sin publicar. ¿Salir de todos modos?')) return;
        edits = {}; storePw('');
        location.replace(location.pathname + location.search + '#findesemana');
      });

      window.addEventListener('beforeunload', ev => { if (Object.keys(edits).length) { ev.preventDefault(); ev.returnValue = ''; } });
    }

    // Entrar o salir de #admin recarga la página en el modo correcto
    window.addEventListener('hashchange', () => {
      const wantsAdmin = (location.hash || '').toLowerCase() === '#admin';
      if (wantsAdmin !== ADMIN) location.reload();
    });

    if (ADMIN) startAdmin(); else loadData();
  </script>
</body>
</html>
